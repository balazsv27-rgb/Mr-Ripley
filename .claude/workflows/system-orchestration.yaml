name: mr-ripley-governance-orchestration
description: >
  Project-level orchestration manifest for the Claude-assisted governance workflow.
  Coordinates constitution normative constraints, runtime/code integrity checks,
  documentation consistency, and evidence-based verification using a dual-layer model:
  (1) semantic / documentary governance
  (2) code / runtime truth enforcement.
  Every declared skill is actively wired into the workflow execution path.
  Stage gates, hooks, and subagents are operationalized — not passive metadata.
  This file is the authoritative execution specification for the DAG runner.

version: 4.0.0

# =========================================================
# EXECUTION METADATA
# Used by the DAG runner to validate schema and predicate compatibility.
# =========================================================
execution_metadata:
  workflow_schema_version: "4.0"
  predicate_language_version: "1.0"
  artifact_contract_version: "1.0"
  execution_model: dag
  enforcement_model: hook_plus_runner
  note: >
    The DAG runner executes workflow steps in topological order.
    Hooks inspect runner state and enforce tool gating.
    Skills evaluate inputs and produce artifacts.
    Blocking conditions halt forward progress until resolved.
    CLAUDE.md defines normative constraints only — it does not execute steps.
    This manifest defines the executable structure. These roles must not be conflated.

# =========================================================
# CONSTITUTION
# =========================================================
constitution:
  file: CLAUDE.md
  role: authoritative_normative_constraints
  responsibilities:
    - define canonical project principles
    - define Layer-2 truth discipline (snapshot-only, fail-closed)
    - define Layer-3 decision constraints
    - define evidence classification rules
    - define claim vs proof vs runtime observation distinction
    - define canonical document roles and interpretation priorities
    - define execution boundary (analysis-only; no automated trading)
    - define phase-gate model (A complete, B allowed, C/D blocked)
    - define document update obligations for contract-affecting changes
  execution_policy:
    workflow_mandatory: true
    enforce_order: true
    enforce_stage_gates: true
    enforce_blocking_conditions: true
    reject_partial_execution: true
  note: >
    CLAUDE.md defines obligations and interpretive constraints.
    It is NOT a workflow and does NOT execute workflow steps.
    Execution is delegated to the DAG runner via this manifest.
    Enforcement is delegated to runtime mechanisms (hooks, validators, skill outputs).

# =========================================================
# ORCHESTRATION MANIFEST SELF-REFERENCE
# =========================================================
orchestration_manifest:
  file: .claude/workflows/system-orchestration.yaml
  role: workflow_execution_manifest
  note: >
    This manifest defines the executable workflow structure.
    It does not override canonical documents or serve as a truth source.
    It is the authoritative specification for step ordering, artifact ownership,
    predicate evaluation, blocking-condition propagation, and hook binding.

# =========================================================
# SCOPE PREDICATES
# Formal machine-readable scope classes for the DAG runner.
# Used in condition, requires_if, and skip_if fields throughout this manifest.
# All predicate types must be interpretable by the runner without natural-language parsing.
# =========================================================
scope_predicates:

  runtime_code_scope:
    id: runtime_code_scope
    description: Change touches runtime or code files
    type: path_match_any
    matches_paths:
      - "layer2/**"
      - "layer3/**"
      - "layer2/adapters/**"
      - "layer2/db.py"
      - "layer2/alignment.py"
      - "layer2/clock.py"

  adapter_registry_scope:
    id: adapter_registry_scope
    description: Change touches adapter or registry files
    type: path_match_any
    matches_paths:
      - "layer2/adapters/**"
      - "layer2/config/series_registry.json"
      - "layer2/config/registry.py"

  rename_only_change:
    id: rename_only_change
    description: >
      Change is a file name or document identifier rename without
      semantic content modification.
    type: artifact_field_equals
    artifact: change_impact_report
    field: change_type
    value: rename_only

  contract_affecting_change:
    id: contract_affecting_change
    description: >
      Change affects snapshot contract, canonical document role,
      execution boundary, or any item governed by CLAUDE.md section 11.
    type: artifact_field_equals
    artifact: change_impact_report
    field: contract_affecting
    value: true

  matrix_posture_affected:
    id: matrix_posture_affected
    description: >
      Change affects classification posture in the documentation
      verification matrix.
    type: artifact_field_equals
    artifact: change_impact_report
    field: matrix_posture_affected
    value: true

  doc_update_required:
    id: doc_update_required
    description: Change requires a documentation update plan to be produced.
    type: artifact_field_equals
    artifact: change_impact_report
    field: doc_update_required
    value: true

# =========================================================
# SKILLS
# 13 skills declared and mapped to workflow steps.
# Skills are registry-bound; the DAG runner uses name as executor key.
# Each skill has a single declared workflow_step and produces a unique artifact set.
# =========================================================
skills:

  - name: doc-truth-classification
    role: claim_classification_method
    purpose: >
      Classify claims as current-state, target-state, historical, or unverified.
      Uses canonical source priority and evidence-aware confidence rules.
    workflow_step: classify-claims
    produces:
      - claim_classification_map

  - name: canonical-terminology-map
    role: normalization_method
    purpose: >
      Enforce consistent naming across all claims and documentation references.
      Detects variant drift (NO_TRADE, snapshot, DecisionPacket, Layer-2, etc.).
    workflow_step: normalize-terminology
    produces:
      - normalized_terminology_map

  - name: role-matched-citation-check
    role: interpretation_method
    purpose: >
      Enforce use of the canonical document whose role best matches each claim.
      Detect role-mismatched citations and README_LAYER2 override misuse.
    workflow_step: route-claims-by-role
    produces:
      - role_citation_verdict

  - name: build-sequence-compliance-check
    role: phase_alignment_method
    purpose: >
      Enforce architecture build order and phase-gate compliance.
      Check for forbidden scope and required scope at the current phase.
    workflow_step: phase-check
    produces:
      - phase_alignment_status

  - name: snapshot-contract-check
    role: contract_validation_method
    purpose: >
      Enforce snapshot-only downstream access and contract boundary rules.
      No raw Layer-2 observation access; no latest_snapshot.json misuse.
    workflow_step: snapshot-contract-check
    produces:
      - contract_compliance_verdict

  - name: snapshot-boundary-check
    role: runtime_integrity_method
    purpose: >
      Enforce no raw observation usage downstream of the Layer-2 boundary.
      Validate runtime and code boundary integrity for Layer-2 -> Layer-3 handoff.
    workflow_step: runtime-boundary-check
    produces:
      - runtime_boundary_verdict

  - name: adapter-schema-review
    role: schema_validation_method
    purpose: >
      Validate registry-driven adapter compliance and hardcoding prohibition.
      series_registry.json is authoritative; no implicit data interpretation allowed.
    workflow_step: adapter-schema-check
    produces:
      - adapter_schema_verdict

  - name: change-impact-audit
    role: impact_assessment_method
    purpose: >
      Assess full impact of the requested or completed change.
      Identify which canonical documents require review or update.
      Produce change_impact_report and doc_update_plan.
    workflow_step: change-impact-audit
    produces:
      - change_impact_report
      - doc_update_plan
    change_type_detection:
      values:
        - content_change
        - rename_only
        - structural_change
    rename_only_definition: >
      File name or document identifier changes without semantic content modification.
    rename_only_requirements:
      alias_map_required: true
      reference_update_required: true
      identity_continuity_required: true
      semantic_invariance_required: true
    doc_update_plan_must_include_if_rename:
      - canonical_doc_identity_update
      - alias_map
      - reference_update_scope
      - invariance_check_required

  - name: rename-invariance-check
    role: rename_semantic_validation_method
    purpose: >
      Verify that rename-only changes do not alter the semantic meaning,
      claim classification, or evidence structure of canonical documents.
      Produces invariance_verdict. Activated only when change_type == rename_only.
    workflow_step: rename-invariance-check
    produces:
      - invariance_verdict
    activation_predicate: rename_only_change

  - name: doc-code-sync-rules
    role: consistency_method
    purpose: >
      Validate that documentation claims remain aligned with actual code,
      runtime behavior, and required project contracts.
      Detect doc/code drift in either direction.
    workflow_step: doc-code-sync-check
    produces:
      - doc_code_sync_status

  - name: verification-matrix-update-method
    role: doc_classification_method
    purpose: >
      Update documentation verification matrix classification posture only.
      Does not update the ledger; does not re-classify claims; does not act as a phase gate.
    workflow_step: update-verification-matrix
    produces:
      - verification_matrix_delta
    scope_constraint: classification_posture_only

  - name: verification-ledger-update
    role: evidence_tracking_method
    purpose: >
      Update claim -> evidence -> status tracking in the verification ledger.
      Does not update matrix; does not re-run earlier governance steps.
    workflow_step: update-verification-ledger
    produces:
      - verification_ledger_delta
    scope_constraint: claim_evidence_status_tracking_only

  - name: runtime-artifact-hygiene-check
    role: workspace_integrity_method
    purpose: >
      Detect unwanted runtime artifacts (stale dbs, snapshot files, generated residue).
      Validate workspace hygiene before any PR or commit.
    workflow_step: runtime-artifact-hygiene-check
    produces:
      - artifact_hygiene_verdict

# =========================================================
# HOOKS
# Each hook reads workflow artifacts produced by the runner.
# Hooks do not re-derive governance truth independently.
# All check fields use structured predicate types, not prose.
# =========================================================
hooks:

  - name: role-matched-doc-guard
    trigger: SubagentStop
    reinforcing_phase: route-claims-by-role
    reinforcing_layer: A_semantic_normalization
    reads_artifacts:
      - role_citation_verdict
    checks:
      - type: artifact_field_not_contains
        artifact: role_citation_verdict
        field: violations
        value: role_mismatch
      - type: artifact_field_not_contains
        artifact: role_citation_verdict
        field: violations
        value: readme_layer2_override
    action: warn_or_block
    on_match: >
      Flag role-mismatch violation in role_citation_verdict.
      Require explicit role-correct citation before proceeding.
      Raise role_mismatch_for_strong_claim or readme_layer2_used_as_override.

  - name: snapshot-boundary-guard
    trigger: PostToolUse
    matcher: "Edit|Write"
    reinforcing_phase: runtime-boundary-check
    reinforcing_layer: C_runtime_schema_integrity
    reads_artifacts:
      - runtime_boundary_verdict
    checks:
      - type: artifact_field_equals
        artifact: runtime_boundary_verdict
        field: raw_observation_access_detected
        value: false
      - type: artifact_field_equals
        artifact: runtime_boundary_verdict
        field: latest_snapshot_misuse_detected
        value: false
      - type: artifact_field_equals
        artifact: runtime_boundary_verdict
        field: layer2_storage_coupling_detected
        value: false
    action: block_on_match
    on_match: raise snapshot_boundary_violation blocking condition

  - name: adapter-schema-guard
    trigger: PostToolUse
    matcher: "Edit|Write"
    reinforcing_phase: adapter-schema-check
    reinforcing_layer: C_runtime_schema_integrity
    reads_artifacts:
      - adapter_schema_verdict
    checks:
      - type: artifact_field_equals
        artifact: adapter_schema_verdict
        field: registry_driven
        value: true
      - type: artifact_field_equals
        artifact: adapter_schema_verdict
        field: hardcoded_series_detected
        value: false
      - type: artifact_field_equals
        artifact: adapter_schema_verdict
        field: implicit_interpretation_detected
        value: false
    action: warn_or_block
    on_match: raise registry_violation or schema_drift_detected blocking condition

  - name: live-readiness-claim-blocker
    trigger: PostToolUse
    matcher: "Edit|Write"
    reinforcing_phase: stage-gate-enforcement
    reinforcing_layer: B_architecture_phase_contract
    reads_artifacts:
      - stage_gate_report
    checks:
      - type: artifact_field_equals
        artifact: stage_gate_report
        field: live_readiness_claim_detected
        value: false
      - type: artifact_field_equals
        artifact: stage_gate_report
        field: execution_capability_claim_detected
        value: false
      - type: artifact_field_equals
        artifact: stage_gate_report
        field: production_ready_claim_detected
        value: false
    action: block_on_match
    on_match: raise unsupported_current_state_claim blocking condition

  - name: doc-code-sync-guard
    trigger: SubagentStop
    reinforcing_phase: doc-code-sync-check
    reinforcing_layer: D_audit_impact
    reads_artifacts:
      - doc_code_sync_status
    checks:
      - type: artifact_field_equals
        artifact: doc_code_sync_status
        field: drift_detected
        value: false
    action: warn
    on_match: flag doc_code_sync_status.drift_detected for doc-code-sync-auditor escalation

  - name: pre-pr-governance-gate
    trigger: PreToolUse
    matcher: "git push|commit"
    reinforcing_phase: pre-pr-governance-readiness
    reinforcing_layer: E_verification_hygiene_release
    reads_artifacts:
      - pr_readiness_verdict
    required_artifacts:
      - artifact: governance_context
        required_always: true
      - artifact: claim_classification_map
        required_always: true
      - artifact: normalized_terminology_map
        required_always: true
      - artifact: role_citation_verdict
        required_always: true
      - artifact: phase_alignment_status
        required_always: true
      - artifact: contract_compliance_verdict
        required_always: true
      - artifact: stage_gate_report
        required_always: true
      - artifact: runtime_boundary_verdict
        required_always: false
        requires_if:
          predicate: runtime_code_scope
      - artifact: adapter_schema_verdict
        required_always: false
        requires_if:
          predicate: adapter_registry_scope
      - artifact: guard_report
        required_always: true
      - artifact: audit_summary
        required_always: true
      - artifact: change_impact_report
        required_always: true
      - artifact: doc_update_plan
        required_always: false
        requires_if:
          predicate: doc_update_required
      - artifact: invariance_verdict
        required_always: false
        requires_if:
          predicate: rename_only_change
      - artifact: doc_code_sync_status
        required_always: true
      - artifact: verification_matrix_delta
        required_always: false
        requires_if:
          predicate: matrix_posture_affected
      - artifact: verification_ledger_delta
        required_always: true
      - artifact: artifact_hygiene_verdict
        required_always: true
      - artifact: pr_readiness_verdict
        required_always: true
    additional_checks:
      - type: artifact_field_equals
        artifact: pr_readiness_verdict
        field: unsupported_strong_claims_remain
        value: false
      - type: artifact_field_equals
        artifact: pr_readiness_verdict
        field: blocking_conditions_unresolved
        value: false
      - type: artifact_field_equals
        artifact: pr_readiness_verdict
        field: required_canonical_docs_reviewed
        value: true
      - type: artifact_field_equals
        artifact: pr_readiness_verdict
        field: canonical_references_updated
        value: true
      - type: artifact_field_equals
        artifact: pr_readiness_verdict
        field: alias_map_present_for_renames
        value: true
        requires_if:
          predicate: rename_only_change
    action: block_on_fail
    on_fail: >
      Reject commit/push.
      Surface missing workflow artifacts and unresolved governance conditions
      from pr_readiness_verdict.failed_checks.

# =========================================================
# SUBAGENTS
# Each subagent is assigned an audit lane and a triggering step.
# Subagents are invoked on escalation only, not by default.
# trigger_condition fields use structured predicate types.
# =========================================================
subagents:

  - name: cross-doc-consistency-auditor
    role: doc_auditor
    audit_lane: documentary_consistency
    triggered_by: doc-code-sync-check
    trigger_condition:
      type: artifact_field_equals
      artifact: doc_code_sync_status
      field: doc_doc_conflict_detected
      value: true
    escalation_condition: unresolved_canonical_conflict

  - name: architecture-sequence-auditor
    role: build_order_auditor
    audit_lane: phase_and_build_order
    triggered_by: phase-check
    trigger_condition:
      type: artifact_field_equals
      artifact: phase_alignment_status
      field: build_order_ambiguity_detected
      value: true
    escalation_condition: stage_gate_ambiguity

  - name: verification-matrix-auditor
    role: classification_auditor
    audit_lane: verification_classification
    triggered_by: update-verification-matrix
    trigger_condition:
      type: artifact_field_equals
      artifact: verification_matrix_delta
      field: classification_dispute_detected
      value: true
    escalation_condition: matrix_classification_conflict

  - name: implementation-history-reconciler
    role: historical_alignment
    audit_lane: historical_source_conflicts
    triggered_by: classify-claims
    trigger_condition:
      type: artifact_field_equals
      artifact: claim_classification_map
      field: non_canonical_source_as_current_truth
      value: true
    escalation_condition: non_canonical_source_used_as_current_truth

  - name: doc-code-sync-auditor
    role: doc_vs_runtime_auditor
    audit_lane: doc_runtime_alignment
    triggered_by: doc-code-sync-check
    trigger_condition:
      type: artifact_field_equals
      artifact: doc_code_sync_status
      field: drift_detected
      value: true
    escalation_condition: doc_code_drift_unresolved

  - name: snapshot-boundary-auditor
    role: runtime_boundary_auditor
    audit_lane: snapshot_boundary_integrity
    triggered_by: runtime-boundary-check
    trigger_condition:
      type: artifact_field_equals
      artifact: runtime_boundary_verdict
      field: boundary_violation_suspected
      value: true
    escalation_condition: snapshot_boundary_violation

  - name: adapter-schema-guardian
    role: schema_governance_specialist
    audit_lane: adapter_schema_governance
    triggered_by: adapter-schema-check
    trigger_condition:
      type: artifact_field_any_equals
      artifact: adapter_schema_verdict
      field: violations
      values:
        - registry_violation
        - schema_drift_detected
    escalation_condition: registry_violation_or_schema_drift_detected

  - name: canonical-role-auditor
    role: role_matched_truth_enforcer
    audit_lane: canonical_role_enforcement
    triggered_by: route-claims-by-role
    trigger_condition:
      type: artifact_field_any_equals
      artifact: role_citation_verdict
      field: violations
      values:
        - role_mismatch_for_strong_claim
        - readme_layer2_used_as_override
    escalation_condition: role_mismatch_or_readme_layer2_override

# =========================================================
# ARTIFACTS
# Each output artifact has exactly one declared producer.
# Conditional artifacts are tied to formal scope predicates.
# =========================================================
artifacts:
  required_inputs:
    canonical_docs:
      - path: README_v1.md
        role: top_level_orientation
        authority: canonical

      - path: SYSTEM_TECHNICAL_HANDBOOK_v1.md
        role: technical_constraints_and_engineering_rules
        authority: canonical

      - path: SYSTEM_LIMITATIONS_AND_APPROXIMATIONS_v1.md
        role: limitations_and_approximations_source_of_truth
        authority: canonical

      - path: SYSTEM_ARCHITECTURE_AND_BUILD_SEQUENCE_v1.md
        role: architecture_source_of_truth
        authority: canonical

      - path: DOCUMENTATION_VERIFICATION_MATRIX_v1.md
        role: documentation_consistency_map
        authority: canonical

      - path: SYSTEM_IMPLEMENTATION_RECORD_v1.md
        role: implementation_state_source_of_truth
        authority: canonical

      - path: README_LAYER2.md
        role: collaborator_guide_and_living_build_reference
        authority: canonical
        constraint: >
          Must not override role-specific canonical documents on implementation
          state, architecture boundaries, or limitations.

    verification_layer:
      - path: verification_ledger.md

    code_context:
      - path: layer2/config/series_registry.json
      - path: layer2/alignment.py
      - path: layer2/adapters/*
      - path: layer2/db.py

    runtime_context:
      - path: latest_snapshot.json
      - path: layer2_truth.db

  expected_outputs:
    - id: governance_context
      produced_by: load-context
      conditional: false

    - id: claim_classification_map
      produced_by: classify-claims
      conditional: false

    - id: normalized_terminology_map
      produced_by: normalize-terminology
      conditional: false

    - id: role_citation_verdict
      produced_by: route-claims-by-role
      conditional: false

    - id: phase_alignment_status
      produced_by: phase-check
      conditional: false

    - id: contract_compliance_verdict
      produced_by: snapshot-contract-check
      conditional: false

    - id: stage_gate_report
      produced_by: stage-gate-enforcement
      conditional: false

    - id: runtime_boundary_verdict
      produced_by: runtime-boundary-check
      conditional: false
      required_at_pr_gate_when_predicate: runtime_code_scope

    - id: adapter_schema_verdict
      produced_by: adapter-schema-check
      conditional: false
      required_at_pr_gate_when_predicate: adapter_registry_scope

    - id: guard_report
      produced_by: runtime-guards-summary
      conditional: false

    - id: audit_summary
      produced_by: deep-audit
      conditional: false

    - id: change_impact_report
      produced_by: change-impact-audit
      conditional: false

    - id: doc_update_plan
      produced_by: change-impact-audit
      conditional: true
      required_at_pr_gate_when_predicate: doc_update_required

    - id: invariance_verdict
      produced_by: rename-invariance-check
      conditional: true
      required_at_pr_gate_when_predicate: rename_only_change

    - id: doc_code_sync_status
      produced_by: doc-code-sync-check
      conditional: false

    - id: verification_matrix_delta
      produced_by: update-verification-matrix
      conditional: true
      required_at_pr_gate_when_predicate: matrix_posture_affected

    - id: verification_ledger_delta
      produced_by: update-verification-ledger
      conditional: false

    - id: artifact_hygiene_verdict
      produced_by: runtime-artifact-hygiene-check
      conditional: false

    - id: pr_readiness_verdict
      produced_by: pre-pr-governance-readiness
      conditional: false

# =========================================================
# INTERPRETATION POLICY
# =========================================================
interpretation_policy:
  canonical_docs_are_authoritative: true
  canonical_docs_are_not_interchangeable: true
  require_role_matched_citation: true

  claim_routing:
    architecture_claims: SYSTEM_ARCHITECTURE_AND_BUILD_SEQUENCE_v1.md
    implementation_claims: SYSTEM_IMPLEMENTATION_RECORD_v1.md
    limitation_claims: SYSTEM_LIMITATIONS_AND_APPROXIMATIONS_v1.md
    collaborator_workflow_claims: README_LAYER2.md
    documentation_consistency_claims: DOCUMENTATION_VERIFICATION_MATRIX_v1.md
    technical_constraint_claims: SYSTEM_TECHNICAL_HANDBOOK_v1.md
    top_level_orientation_claims: README_v1.md

  on_conflict:
    action: block_strong_claim
    require_conflict_note: true
    require_explicit_citations: true
    resolution_rule: prefer_role_specific_document
    escalate_for_doc_sync: true
    escalation_target: cross-doc-consistency-auditor

  note: >
    The claim_routing table governs which step routes each claim type.
    Operationalized at route-claims-by-role; enforced by role-matched-doc-guard
    throughout downstream steps.

# =========================================================
# STAGE GATES
# Each gate is a machine-evaluable enforcement node.
# check fields use structured predicate types.
# on_violation raises a named blocking condition deterministically.
# =========================================================
stage_gates:

  phase_a_layer2_closure:
    status: complete_at_contract_boundary
    enforcement_step: stage-gate-enforcement
    allowed_scope:
      - layer2_operational
      - snapshot_boundary
    required_scope:
      - snapshot_contract_stable
      - engine_version_present
      - config_version_present
      - guards_object_in_snapshot
      - reason_code_enum_defined
    check:
      type: artifact_field_equals
      artifact: phase_alignment_status
      field: phase_a_satisfied
      value: true
    on_violation:
      raises: unsupported_current_state_claim

  phase_b_layer3_bootstrap:
    status: allowed_not_completed
    enforcement_step: stage-gate-enforcement
    allowed_scope:
      - snapshot_consumer
      - decisionpacket_skeleton
      - no_trade_default_path
      - state_taxonomy_stub
      - guard_taxonomy_stub
      - deterministic_calculations_2_to_3
    forbidden_scope:
      - feature_builder
      - live_execution
      - calibration_logic
      - index_suite
      - regime_gate
      - supervisor_engine
      - decision_engine
    check:
      type: artifact_field_not_contains
      artifact: phase_alignment_status
      field: detected_forbidden_scope
      value: any_forbidden_phase_b_item
    on_violation:
      raises: unsupported_current_state_claim

  phase_c_layer3_structured_buildout:
    status: future
    enforcement_step: stage-gate-enforcement
    allowed_scope: []
    forbidden_scope:
      - feature_builder_active
      - index_suite_active
      - regime_gate_active
      - supervisor_engine_active
      - decision_engine_active
    check:
      type: artifact_field_equals
      artifact: phase_alignment_status
      field: phase_c_active
      value: false
    on_violation:
      raises: unsupported_current_state_claim

  phase_d_live_execution_gate:
    status: blocked
    enforcement_step: stage-gate-enforcement
    allowed_scope: []
    forbidden_scope:
      - live_execution
      - execution_capability
      - automated_trading
      - order_generation
      - signal_execution
      - decision_triggering
    check:
      type: artifact_field_equals
      artifact: phase_alignment_status
      field: live_execution_claim_detected
      value: false
    on_violation:
      raises: unsupported_current_state_claim

# =========================================================
# BLOCKING CONDITIONS
# Normalized structure for DAG runner consumption.
# Any raised condition halts forward progress until resolved.
# =========================================================
blocking_conditions:

  - id: snapshot_boundary_violation
    raises_at: runtime-boundary-check
    raised_by: skill:snapshot-boundary-check
    enforced_by_hook: snapshot-boundary-guard
    severity: critical
    halts_workflow: true
    resolvable: true
    resolution_required: restore_snapshot_only_access_and_remove_raw_observation_reads

  - id: raw_observations_used_in_layer3
    raises_at: runtime-boundary-check
    raised_by: skill:snapshot-boundary-check
    enforced_by_hook: snapshot-boundary-guard
    severity: critical
    halts_workflow: true
    resolvable: true
    resolution_required: remove_direct_observation_access_from_downstream_components

  - id: registry_violation
    raises_at: adapter-schema-check
    raised_by: skill:adapter-schema-review
    enforced_by_hook: adapter-schema-guard
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: restore_registry_driven_adapter_configuration

  - id: schema_drift_detected
    raises_at: adapter-schema-check
    raised_by: skill:adapter-schema-review
    enforced_by_hook: adapter-schema-guard
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: align_adapter_schema_with_series_registry

  - id: unsupported_current_state_claim
    raises_at: stage-gate-enforcement
    raised_by: stage_gates
    enforced_by_hook: live-readiness-claim-blocker
    severity: critical
    halts_workflow: true
    resolvable: true
    resolution_required: reclassify_claim_as_planned_or_target_architecture

  - id: verification_without_evidence
    raises_at: update-verification-ledger
    raised_by: skill:verification-ledger-update
    enforced_by_hook: null
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: provide_traceable_evidence_canonical_or_code_level

  - id: canonical_conflict_unresolved
    raises_at: route-claims-by-role
    raised_by: skill:role-matched-citation-check
    enforced_by_hook: role-matched-doc-guard
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: resolve_canonical_doc_conflict_with_explicit_role_matched_citations

  - id: role_mismatch_for_strong_claim
    raises_at: route-claims-by-role
    raised_by: skill:role-matched-citation-check
    enforced_by_hook: role-matched-doc-guard
    severity: high
    halts_workflow: false
    resolvable: true
    resolution_required: replace_citation_with_role_correct_canonical_document

  - id: readme_layer2_used_as_override
    raises_at: route-claims-by-role
    raised_by: skill:role-matched-citation-check
    enforced_by_hook: role-matched-doc-guard
    severity: medium
    halts_workflow: false
    resolvable: true
    resolution_required: use_role_specific_canonical_document_instead_of_readme_layer2

  - id: pr_governance_not_satisfied
    raises_at: pre-pr-governance-readiness
    raised_by: hooks:pre-pr-governance-gate
    enforced_by_hook: pre-pr-governance-gate
    severity: critical
    halts_workflow: true
    resolvable: true
    resolution_required: satisfy_all_required_artifact_and_condition_checks_in_pr_readiness_verdict

  - id: rename_invariance_violation
    raises_at: rename-invariance-check
    raised_by: skill:rename-invariance-check
    enforced_by_hook: null
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: restore_semantic_equivalence_in_renamed_canonical_documents

  - id: missing_alias_mapping
    raises_at: change-impact-audit
    raised_by: skill:change-impact-audit
    enforced_by_hook: null
    severity: high
    halts_workflow: true
    resolvable: true
    resolution_required: add_alias_map_for_renamed_canonical_document_to_doc_update_plan

# =========================================================
# VERIFICATION LEDGER
# =========================================================
verification_ledger:
  file: verification_ledger.md
  structure:
    fields:
      - claim
      - classification
      - claim_type
      - preferred_canonical_source
      - evidence_source
      - evidence_type:
          values:
            - doc
            - code
            - runtime
      - status:
          values:
            - proven
            - supported
            - unverified
            - contradicted

  update_rules:
    - doc_only_updates_do_not_prove_runtime
    - runtime_observation_has_highest_weight
    - code_alignment_required_for_proven_status
    - role_matched_canonical_source_required_for_strong_doc_claims

  separation_rule: >
    verification-matrix-update-method updates classification posture only.
    verification-ledger-update updates claim->evidence->status tracking only.
    These two steps must never be merged or substituted for each other.

# =========================================================
# WORKFLOW
#
# Five-layer execution structure:
#
#   A. Context + Semantic Normalization
#   B. Architecture + Phase + Contract Gating
#   C. Runtime / Schema / Boundary Integrity
#   D. Audit + Impact
#   E. Verification + Hygiene + Release Readiness
#
# Each step schema:
#   id            - unique step identifier (DAG node key)
#   layer         - governance layer
#   component     - bound executor: skill:<name>, stage_gates, subagents, or hooks
#   purpose       - what this step accomplishes
#   inputs        - artifacts or documents consumed
#   outputs       - artifacts produced (each id has exactly one producer across the DAG)
#   depends_on    - upstream step ids required before this step may execute (DAG edges)
#   validates     - blocking conditions evaluated at this step
#   raises        - blocking condition ids this step may emit
#   on_block      - action when a blocking condition is raised
#
# Optional step fields:
#   condition     - structured predicate; step executes only when predicate evaluates true
#   skip_if       - structured predicate; step is skipped when predicate evaluates true
#   requires_if   - conditional input requirement tied to a predicate
#   consumes_hook_signals - hook outputs synthesized by this step
#   escalates_to  - subagent dispatch rules evaluated after step outputs are produced
#   reinforced_by_hook - hook name that re-checks this step's output at runtime
# =========================================================
workflow:

  # -------------------------------------------------------
  # LAYER A — Context + Semantic Normalization
  # Establishes the interpretive foundation.
  # All downstream steps consume outputs from this layer.
  # -------------------------------------------------------

  - id: load-context
    layer: A_semantic_normalization
    component: constitution
    purpose: >
      Load CLAUDE.md and all canonical documents to establish the interpretive
      authority, evidence classification rules, and snapshot/execution constraints
      that govern all downstream steps.
    inputs:
      - CLAUDE.md
      - canonical_docs
    outputs:
      - governance_context
    depends_on: []
    validates: []
    raises: []
    on_block: halt — constitution load failure is unrecoverable

  - id: classify-claims
    layer: A_semantic_normalization
    component: skill:doc-truth-classification
    purpose: >
      Classify every major claim or requested change as:
      current-state, target-state, historical, or unverified.
      Uses canonical source priority and evidence-aware confidence rules.
      Flags non-canonical or superseded sources if referenced.
    inputs:
      - governance_context
      - canonical_docs
    outputs:
      - claim_classification_map
    depends_on:
      - load-context
    validates:
      - historical_sources_not_used_as_current_truth
    raises:
      - canonical_conflict_unresolved
    escalates_to:
      - condition:
          type: artifact_field_equals
          artifact: claim_classification_map
          field: non_canonical_source_as_current_truth
          value: true
        invoke: implementation-history-reconciler
    on_block: >
      Escalate to implementation-history-reconciler subagent if non-canonical
      historical materials are presented as current-state truth.

  - id: normalize-terminology
    layer: A_semantic_normalization
    component: skill:canonical-terminology-map
    purpose: >
      Enforce consistent use of project-defined terms across all claims,
      documentation references, and implementation-facing descriptions.
      Detects variant drift (e.g., "trade signal" vs NO_TRADE,
      "db" vs layer2_truth.db, "decision packet" vs DecisionPacket).
    inputs:
      - governance_context
      - claim_classification_map
    outputs:
      - normalized_terminology_map
    depends_on:
      - classify-claims
    validates:
      - canonical_terminology_used_consistently
    raises: []
    on_block: >
      Flag terminology violations for correction before proceeding to gating layers.

  - id: route-claims-by-role
    layer: A_semantic_normalization
    component: skill:role-matched-citation-check
    purpose: >
      Enforce that each claim is supported by the role-correct canonical document.
      Detect role-mismatched citations and README_LAYER2 override misuse.
      Apply the interpretation_policy.claim_routing table.
      Produce a role/citation verdict for downstream gating.
    inputs:
      - governance_context
      - claim_classification_map
      - normalized_terminology_map
      - interpretation_policy.claim_routing
    outputs:
      - role_citation_verdict
    depends_on:
      - normalize-terminology
    validates:
      - canonical_conflict_unresolved
      - role_mismatch_for_strong_claim
      - readme_layer2_used_as_override
    raises:
      - canonical_conflict_unresolved
      - role_mismatch_for_strong_claim
      - readme_layer2_used_as_override
    reinforced_by_hook: role-matched-doc-guard
    escalates_to:
      - condition:
          type: artifact_field_any_equals
          artifact: role_citation_verdict
          field: violations
          values:
            - role_mismatch_for_strong_claim
            - readme_layer2_used_as_override
        invoke: canonical-role-auditor
    on_block: >
      Raise canonical_conflict_unresolved or role_mismatch_for_strong_claim.
      Escalate to canonical-role-auditor subagent for deep role resolution.

  # -------------------------------------------------------
  # LAYER B — Architecture + Phase + Contract Gating
  # Enforces build-order compliance, snapshot contracts,
  # stage-gate rules, and live-readiness claim blocking.
  # -------------------------------------------------------

  - id: phase-check
    layer: B_architecture_phase_contract
    component: skill:build-sequence-compliance-check
    purpose: >
      Verify the requested change is compatible with the documented build sequence
      and current phase gate (Phase A complete, Phase B allowed, Phase C/D blocked).
      Checks for forbidden scope and required scope at the current phase.
    inputs:
      - role_citation_verdict
      - claim_classification_map
      - SYSTEM_ARCHITECTURE_AND_BUILD_SEQUENCE_v1.md
      - stage_gates
    outputs:
      - phase_alignment_status
    depends_on:
      - route-claims-by-role
    validates:
      - unsupported_current_state_claim
    raises:
      - unsupported_current_state_claim
    escalates_to:
      - condition:
          type: artifact_field_equals
          artifact: phase_alignment_status
          field: build_order_ambiguity_detected
          value: true
        invoke: architecture-sequence-auditor
    on_block: >
      Block if forbidden scope detected for current phase.
      Escalate to architecture-sequence-auditor subagent for ambiguous build-order claims.

  - id: snapshot-contract-check
    layer: B_architecture_phase_contract
    component: skill:snapshot-contract-check
    purpose: >
      Validate that all downstream logic consumes only governed published snapshots.
      Enforce: no raw Layer-2 observation access, no latest_snapshot.json misuse,
      no snapshot truth rewrite, no Layer-2 storage coupling outside governed interface.
    inputs:
      - phase_alignment_status
      - role_citation_verdict
      - SYSTEM_ARCHITECTURE_AND_BUILD_SEQUENCE_v1.md
      - SYSTEM_TECHNICAL_HANDBOOK_v1.md
    outputs:
      - contract_compliance_verdict
    depends_on:
      - phase-check
    validates:
      - snapshot_boundary_violation
      - raw_observations_used_in_layer3
    raises:
      - snapshot_boundary_violation
      - raw_observations_used_in_layer3
    on_block: >
      Raise snapshot_boundary_violation blocking condition.
      Escalate to snapshot-boundary-auditor subagent.

  - id: stage-gate-enforcement
    layer: B_architecture_phase_contract
    component: stage_gates
    purpose: >
      Operationalize declared stage gates. For each phase gate:
      (1) confirm required scope is present or appropriately future-scoped,
      (2) reject forbidden scope unconditionally,
      (3) block live-readiness or execution-capability claims before Phase D,
      (4) produce a stage_gate_report summarizing all gate results.
      This is an active enforcement step — not a metadata reference.
    inputs:
      - phase_alignment_status
      - contract_compliance_verdict
      - claim_classification_map
      - stage_gates
      - blocking_conditions
    outputs:
      - stage_gate_report
    depends_on:
      - snapshot-contract-check
    validates:
      - unsupported_current_state_claim
    raises:
      - unsupported_current_state_claim
    reinforced_by_hook: live-readiness-claim-blocker
    on_block: >
      Reject the request. Surface which gate was violated and which claims triggered it.
      Do not advance to runtime/schema layer until stage_gate_report is clean.

  # -------------------------------------------------------
  # LAYER C — Runtime / Schema / Boundary Integrity
  # Enforces code-level boundary rules, adapter/registry
  # discipline, and activates runtime guards.
  # -------------------------------------------------------

  - id: runtime-boundary-check
    layer: C_runtime_schema_integrity
    component: skill:snapshot-boundary-check
    purpose: >
      Validate runtime and code boundary integrity for the Layer-2 -> Layer-3 handoff.
      Confirm no downstream raw observation access, no snapshot truth rewrite,
      no boundary bypass in adapters or Layer-3 stubs.
    inputs:
      - stage_gate_report
      - contract_compliance_verdict
      - code_context
      - runtime_context
    outputs:
      - runtime_boundary_verdict
    depends_on:
      - stage-gate-enforcement
    validates:
      - snapshot_boundary_violation
      - raw_observations_used_in_layer3
    raises:
      - snapshot_boundary_violation
      - raw_observations_used_in_layer3
    reinforced_by_hook: snapshot-boundary-guard
    escalates_to:
      - condition:
          type: artifact_field_equals
          artifact: runtime_boundary_verdict
          field: boundary_violation_suspected
          value: true
        invoke: snapshot-boundary-auditor
    on_block: >
      Raise snapshot_boundary_violation.
      Escalate to snapshot-boundary-auditor subagent for deep runtime boundary audit.

  - id: adapter-schema-check
    layer: C_runtime_schema_integrity
    component: skill:adapter-schema-review
    purpose: >
      Validate registry-driven adapter compliance and schema discipline at the
      Layer-2 ingestion/runtime boundary.
      Check: no hardcoded series logic, series_registry.json is authoritative,
      no implicit data interpretation, no hidden mappings.
    inputs:
      - runtime_boundary_verdict
      - code_context
      - SYSTEM_TECHNICAL_HANDBOOK_v1.md
    outputs:
      - adapter_schema_verdict
    depends_on:
      - runtime-boundary-check
    validates:
      - registry_violation
      - schema_drift_detected
    raises:
      - registry_violation
      - schema_drift_detected
    reinforced_by_hook: adapter-schema-guard
    escalates_to:
      - condition:
          type: artifact_field_any_equals
          artifact: adapter_schema_verdict
          field: violations
          values:
            - registry_violation
            - schema_drift_detected
        invoke: adapter-schema-guardian
    on_block: >
      Raise registry_violation or schema_drift_detected.
      Escalate to adapter-schema-guardian subagent.

  - id: runtime-guards-summary
    layer: C_runtime_schema_integrity
    component: hooks
    purpose: >
      Consolidate the guard outputs from snapshot-boundary-guard and adapter-schema-guard
      into a unified guard_report. Does not invoke new tools — synthesizes hook-driven
      blocking signals from the runtime layer into a single artifact for audit
      and downstream consumption.
    inputs:
      - runtime_boundary_verdict
      - adapter_schema_verdict
    consumes_hook_signals:
      - snapshot-boundary-guard
      - adapter-schema-guard
    outputs:
      - guard_report
    depends_on:
      - adapter-schema-check
    validates:
      - all_c_layer_blocking_conditions_resolved
    raises: []
    on_block: >
      Do not advance to Layer D if any C-layer blocking condition remains unresolved.

  # -------------------------------------------------------
  # LAYER D — Audit + Impact
  # Deep audit via subagents (A-C escalations), change impact
  # assessment, rename invariance check, and doc/code sync review.
  # -------------------------------------------------------

  - id: deep-audit
    layer: D_audit_impact
    component: subagents
    purpose: >
      Invoke targeted deep audits through the appropriate subagent based on
      escalation signals raised in Layers A–C.
      Each subagent is invoked only when its specific escalation condition is met.
      Only A-C artifacts are available at this step; Layer D artifacts are not yet produced.
    inputs:
      - guard_report
      - role_citation_verdict
      - phase_alignment_status
      - contract_compliance_verdict
      - stage_gate_report
      - runtime_boundary_verdict
      - adapter_schema_verdict
      - claim_classification_map
    outputs:
      - audit_summary
    depends_on:
      - runtime-guards-summary
    audit_dispatch:
      - condition:
          type: artifact_field_any_equals
          artifact: role_citation_verdict
          field: violations
          values:
            - role_mismatch_for_strong_claim
            - readme_layer2_used_as_override
        invoke: canonical-role-auditor
      - condition:
          type: artifact_field_equals
          artifact: phase_alignment_status
          field: build_order_ambiguity_detected
          value: true
        invoke: architecture-sequence-auditor
      - condition:
          type: artifact_field_equals
          artifact: runtime_boundary_verdict
          field: boundary_violation_suspected
          value: true
        invoke: snapshot-boundary-auditor
      - condition:
          type: artifact_field_any_equals
          artifact: adapter_schema_verdict
          field: violations
          values:
            - registry_violation
            - schema_drift_detected
        invoke: adapter-schema-guardian
      - condition:
          type: artifact_field_equals
          artifact: claim_classification_map
          field: non_canonical_source_as_current_truth
          value: true
        invoke: implementation-history-reconciler
    raises: []
    on_block: >
      If any audit returns unresolved violations, raise the corresponding blocking
      condition and halt advancement to verification layer.

  - id: change-impact-audit
    layer: D_audit_impact
    component: skill:change-impact-audit
    purpose: >
      Assess the full impact of the requested or completed change.
      Identify which canonical documents require review or update per CLAUDE.md section 11.
      Produce a structured change_impact_report and doc_update_plan.
      Consumes all prior governance step outputs.
    inputs:
      - audit_summary
      - claim_classification_map
      - role_citation_verdict
      - phase_alignment_status
      - stage_gate_report
      - guard_report
    outputs:
      - change_impact_report
      - doc_update_plan
    depends_on:
      - deep-audit
    validates:
      - contract_affecting_changes_flagged_for_doc_update_obligations
    raises:
      - missing_alias_mapping
    on_block: >
      If a contract-affecting change is detected but no doc_update_plan is producible,
      block and require manual reconciliation before proceeding.

  - id: rename-invariance-check
    layer: D_audit_impact
    component: skill:rename-invariance-check
    purpose: >
      Verify that rename-only changes do not alter the semantic meaning,
      claim classification, or evidence structure of canonical documents.
      Step is skipped when change_type != rename_only.
    inputs:
      - change_impact_report
      - claim_classification_map
      - canonical_docs
    outputs:
      - invariance_verdict
    depends_on:
      - change-impact-audit
    condition:
      type: artifact_field_equals
      artifact: change_impact_report
      field: change_type
      value: rename_only
    skip_if:
      type: artifact_field_not_equals
      artifact: change_impact_report
      field: change_type
      value: rename_only
    validates:
      - claim_classification_unchanged
      - no_new_claims_introduced
      - no_claims_removed
      - evidence_type_consistency_preserved
      - role_mapping_preserved
    raises:
      - rename_invariance_violation
    on_block: >
      Raise rename_invariance_violation.
      Block workflow until semantic equivalence is restored.

  - id: doc-code-sync-check
    layer: D_audit_impact
    component: skill:doc-code-sync-rules
    purpose: >
      Validate whether documentation claims remain aligned with actual code,
      runtime behavior, and required project contracts.
      Detect doc/code drift in either direction.
      Produce a sync verdict for the doc-code-sync-guard hook and downstream steps.
    inputs:
      - change_impact_report
      - doc_update_plan
      - canonical_docs
      - code_context
    outputs:
      - doc_code_sync_status
    depends_on:
      - change-impact-audit
    validates:
      - verification_without_evidence
    raises:
      - verification_without_evidence
    reinforced_by_hook: doc-code-sync-guard
    escalates_to:
      - condition:
          type: artifact_field_equals
          artifact: doc_code_sync_status
          field: drift_detected
          value: true
        invoke: doc-code-sync-auditor
      - condition:
          type: artifact_field_equals
          artifact: doc_code_sync_status
          field: doc_doc_conflict_detected
          value: true
        invoke: cross-doc-consistency-auditor
    on_block: >
      If doc/code drift is unresolved, escalate to doc-code-sync-auditor subagent.
      Do not advance to verification layer with unresolved drift.

  # -------------------------------------------------------
  # LAYER E — Verification + Hygiene + Release Readiness
  # Updates verification posture, ledger tracking, workspace
  # hygiene, and gates the PR/commit path.
  # -------------------------------------------------------

  - id: update-verification-matrix
    layer: E_verification_hygiene_release
    component: skill:verification-matrix-update-method
    purpose: >
      Determine whether the documentation verification matrix needs to be updated
      based on prior governance step outputs.
      Produces a structured matrix delta.
      SCOPE: classification posture only — does not update the ledger,
      does not re-classify claims, and does not act as a phase gate.
    inputs:
      - doc_code_sync_status
      - change_impact_report
      - audit_summary
      - DOCUMENTATION_VERIFICATION_MATRIX_v1.md
    outputs:
      - verification_matrix_delta
    depends_on:
      - doc-code-sync-check
    validates:
      - matrix_entries_consistent_with_canonical_doc_set
    raises: []
    escalates_to:
      - condition:
          type: artifact_field_equals
          artifact: verification_matrix_delta
          field: classification_dispute_detected
          value: true
        invoke: verification-matrix-auditor
    on_block: >
      Escalate to verification-matrix-auditor subagent if classification dispute detected.

  - id: update-verification-ledger
    layer: E_verification_hygiene_release
    component: skill:verification-ledger-update
    purpose: >
      Update the verification ledger: claim -> evidence -> status tracking.
      Applies ledger update_rules: runtime > code > doc evidence weight.
      SCOPE: claim/evidence/status tracking only — does not update matrix,
      does not re-run earlier governance steps.
      Produces verification_ledger_delta.
    inputs:
      - verification_matrix_delta
      - doc_code_sync_status
      - change_impact_report
      - audit_summary
      - verification_ledger.md
    outputs:
      - verification_ledger_delta
    depends_on:
      - update-verification-matrix
    validates:
      - verification_without_evidence
      - doc_only_updates_do_not_prove_runtime
    raises:
      - verification_without_evidence
    on_block: >
      Raise verification_without_evidence if a claim is promoted to proven without
      traceable evidence.

  - id: runtime-artifact-hygiene-check
    layer: E_verification_hygiene_release
    component: skill:runtime-artifact-hygiene-check
    purpose: >
      Validate workspace and runtime artifact hygiene.
      Detect stale databases, unexpected snapshot files, generated runtime residue,
      and commit-sensitive artifacts that would confuse verification evidence.
      Produces artifact_hygiene_verdict.
    inputs:
      - verification_ledger_delta
      - runtime_context
      - workspace_state
    outputs:
      - artifact_hygiene_verdict
    depends_on:
      - update-verification-ledger
    validates:
      - no_unexpected_runtime_artifacts_in_workspace
      - no_evidence_confusing_residue_in_commit_scope
    raises: []
    on_block: >
      Flag stale or ungoverned artifacts; require cleanup or explicit governance
      declaration before advancing to pre-PR gate.

  - id: pre-pr-governance-readiness
    layer: E_verification_hygiene_release
    component: hooks
    purpose: >
      Final governance gate before any PR creation or push.
      Synthesizes all layer outputs into a pr_readiness_verdict.
      Operationalizes the pre-pr-governance-gate hook.
      Blocks if: any blocking condition unresolved, ledger not updated,
      doc_update_plan not executed when required, hygiene not verified,
      or any unsupported strong claims remain.
    inputs:
      - verification_matrix_delta
      - verification_ledger_delta
      - artifact_hygiene_verdict
      - doc_code_sync_status
      - stage_gate_report
      - guard_report
      - audit_summary
      - blocking_conditions
    outputs:
      - pr_readiness_verdict
    depends_on:
      - runtime-artifact-hygiene-check
    validates:
      - pr_governance_not_satisfied
      - all_blocking_conditions_cleared
      - required_canonical_docs_reviewed_per_claude_md_section_11
