name: mr-ripley-governance-orchestration
description: >
  Compiled entry manifest for the Mr. Ripley gold first engine governance workflow.
  Coordinates constitution normative constraints, runtime/code integrity checks,
  documentation consistency, and evidence-based verification using a dual-layer model:
  (1) semantic / documentary governance
  (2) code / runtime truth enforcement.
  Every declared skill is actively wired into the workflow execution path.
  Stage gates, hooks, and subagents are operationalized — not passive metadata.
  This file is the authoritative execution entrypoint for the DAG runner.

version: 4.1.0

# =========================================================
# ASSEMBLY METADATA
# Defines how the DAG runner loads and merges packages
# into a single normalized in-memory execution spec.
#
# Assembly strategy: package_compiled_manifest
#   1. Load this root manifest.
#   2. Resolve each package in declared order.
#   3. Merge each package's `data` block into the named section.
#   4. Validate the assembled spec (unique step IDs, single artifact
#      producers, skill existence, hook references, predicate refs,
#      blocking condition refs, stage gate refs, DAG edge consistency,
#      no cycles).
#   5. Compile the DAG.
#
# Fail-closed: if any package fails to load or the assembled spec
# fails validation, the runner MUST halt immediately.
# =========================================================
assembly:
  mode: package_compiled_manifest
  entrypoint: .claude/workflows/system-orchestration.yaml
  strategy: merge_by_section
  fail_on_load_error: true
  fail_on_validation_error: true

  packages:
    - path: packages/execution-metadata.yaml
      section: execution_metadata

    - path: packages/constitution.yaml
      section: constitution

    - path: packages/manifest.yaml
      section: orchestration_manifest

    - path: packages/predicates.yaml
      section: scope_predicates

    - path: packages/skills.yaml
      section: skills

    - path: packages/hooks.yaml
      section: hooks

    - path: packages/subagents.yaml
      section: subagents

    - path: packages/agents.yaml
      section: agents

    - path: packages/artifacts.yaml
      section: artifacts

    - path: packages/interpretation-policy.yaml
      section: interpretation_policy

    - path: packages/stage-gates.yaml
      section: stage_gates

    - path: packages/blocking-conditions.yaml
      section: blocking_conditions

    - path: packages/verification-ledger.yaml
      section: verification_ledger

    - path: packages/workflow-steps.yaml
      section: workflow

# =========================================================
# VALIDATION EXPECTATIONS
# The DAG runner must verify these invariants after assembly
# and before compilation. Any failed check halts the runner.
# =========================================================
validation_expectations:
  - unique_workflow_step_ids
  - unique_artifact_producers
  - skill_declared_for_every_skill_component_reference
  - hook_reads_declared_artifacts_only
  - all_predicate_references_resolve_to_declared_predicates
  - all_blocking_condition_references_resolve_to_declared_conditions
  - all_stage_gate_references_resolve_to_declared_gates
  - dag_dependency_consistency
  - no_cycles_in_workflow_dependencies
  - every_escalates_to_target_is_a_declared_subagent
  - every_reinforced_by_hook_is_a_declared_hook
  - every_agent_binding_resolves_to_declared_agent
  - every_agent_produces_declared_artifacts_only
  - every_agent_skill_binding_resolves_to_declared_skill

# =========================================================
# COMPATIBILITY METADATA
# =========================================================
compatibility:
  schema_version: "4.0"
  predicate_language_version: "1.0"
  artifact_contract_version: "1.0"
  minimum_runner_version: "1.0"
