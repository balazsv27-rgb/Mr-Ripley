section: verification_ledger
version: "1.0"

data:
  file: verification_ledger.md
  structure:
    fields:
      - claim
      - classification
      - claim_type
      - preferred_canonical_source
      - evidence_source
      - evidence_type:
          values:
            - doc
            - code
            - runtime
      - status:
          values:
            - proven
            - supported
            - unverified
            - contradicted

  update_rules:
    - doc_only_updates_do_not_prove_runtime
    - runtime_observation_has_highest_weight
    - code_alignment_required_for_proven_status
    - role_matched_canonical_source_required_for_strong_doc_claims

  separation_rule: >
    verification-matrix-update-method updates classification posture only.
    verification-ledger-update updates claim->evidence->status tracking only.
    These two steps must never be merged or substituted for each other.
